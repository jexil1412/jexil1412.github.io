<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>地球</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #pad{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));
       display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px;
       opacity:.55;transition:opacity .25s;z-index:2}
  #pad:hover{opacity:.9}
  #pad button{all:unset;box-sizing:border-box;display:grid;place-content:center;border-radius:50%;cursor:pointer;
      background:rgba(10,16,34,.4);border:1px solid rgba(160,190,255,.28);color:#d5e4ff;
      font:15px/1 ui-monospace,monospace;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  #pad button:active,#pad button.on{background:rgba(120,155,255,.45);border-color:rgba(200,220,255,.75)}
  #pad .u{grid-area:1/2}#pad .l{grid-area:2/1}#pad .r{grid-area:2/3}#pad .d{grid-area:3/2}
  #pad .c{grid-area:2/2;font-size:11px;opacity:.75}
  #e{position:fixed;inset:0;display:none;place-content:center;padding:28px;color:#9fd;
     font:13px/1.8 ui-monospace,monospace;white-space:pre-wrap;text-align:left;background:#000}
  #s{position:fixed;left:0;right:0;top:46%;text-align:center;color:#8fb3ff;font:12px/1.6 ui-monospace,monospace;
     letter-spacing:.12em;pointer-events:none}
  #c2{position:fixed;right:12px;bottom:10px;color:#5b6d8c;font:10px/1.5 ui-monospace,monospace;text-align:right;pointer-events:none}
</style>
<canvas id="c"></canvas>
<div id="s">贴图加载中…</div>
<div id="pad">
  <button class="u" data-k="f" aria-label="抬头">▲</button>
  <button class="l" data-k="l" aria-label="向左看">◀</button>
  <button class="c" data-k="c" aria-label="回中">回中</button>
  <button class="r" data-k="r" aria-label="向右看">▶</button>
  <button class="d" data-k="b" aria-label="低头">▼</button>
</div>
<div id="c2">Earth textures © Solar System Scope (CC BY 4.0) · moon map: NASA/JPL</div>
<div id="e"></div>
<script src="js/shaders.js"></script>
<script src="js/main.js"></script>
</html>
